org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

# Gradle 8.x can't run its own build engine on a JDK 25 JVM yet (it crashes trying
# to parse JDK 25 class files internally), but it can still use JDK 25 as a Java
# toolchain to compile/target the project with, as long as it's told where to find
# one. actions/setup-java exports a JAVA_HOME_<version>_<arch> env var for every JDK
# it installs; this line lets Gradle's toolchain auto-detection see that one too.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
