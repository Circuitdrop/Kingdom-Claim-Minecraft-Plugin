# KingdomClaim configuration

# How often (in minutes) kingdom data is autosaved to kingdoms.yml, in addition to the save on shutdown.
autosave-minutes: 5

# Maximum number of chunks a single kingdom may have claimed at once.
max-claims-per-kingdom: 200

# Whether players can teleport to their kingdom's home with /kingdom home.
# Setting a home with /kingdom sethome is always allowed regardless of this.
home-teleport-enabled: true

# Whether clicking a claim in the claims GUI teleports you to it.
claim-teleport-enabled: true

# Whether /kingdom claim can be used in the Nether.
allow-nether-claims: false

# Percentage (0-100) of a kingdom's claimed chunks it loses, starting from the
# edges of its territory and working inward, when its king surrenders a war
# with /kingdom surrender. That many chunks are also locked out of
# max-claims-per-kingdom for that kingdom until an admin lifts the penalty
# with /kingdom admin resetpenalty <kingdom>.
surrender-claim-loss-percent: 20
